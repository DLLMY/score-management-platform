version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: score-management-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: score-management-backend
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/backend/instance
      - ./backend/.env:/app/backend/.env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URI=sqlite:///instance/score_management.db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Celery Worker（消费 notification/mqtt/export/default 队列，此前仅配置未启动 → 定时任务与异步任务永不执行）
  celery-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: score-management-celery-worker
    command: celery -A celery_app worker -Q default,notification,mqtt,export -c 4 --loglevel=info
    volumes:
      - backend-data:/app/backend/instance
      - ./backend/.env:/app/backend/.env
    environment:
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat（按 CELERY_BEAT_SCHEDULE 周期触发 archive_operation_logs / clean_api_cache / warmup_cache / daily_summary / health_check / sync_device_status / clean_expired_results）
  celery-beat:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: score-management-celery-beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - backend-data:/app/backend/instance
      - ./backend/.env:/app/backend/.env
    environment:
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (optional - can be served separately or via backend)
  frontend:
    image: nginx:alpine
    container_name: score-management-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  backend-data:
    driver: local
