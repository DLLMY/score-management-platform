# Backend Python formatting configuration.
# Standardizes: indentation (4 spaces), line length (100), double quotes,
# line-break normalization. Semantics-preserving only.
#
# NOTE: isort (import ordering) was evaluated but DEFERRED — `isort .` hangs
# (1.4 GB RAM, 5+ min) on this large import graph (circular re-exports in
# package __init__ files). Black already delivers the required format
# consistency; import *ordering* is not in scope for this task.

[project]
name = "score-management-backend"
version = "0.1.0"
description = "自我管理提升V2.0 管理平台 — 后端 (Flask + SQLAlchemy + MQTT)"
requires-python = ">=3.11"
# 基础运行依赖以 requirements.txt 为准（Dockerfile 从该文件安装）。
# 以下 ml extra 为「可选重依赖」的一等公民声明，等价于 `pip install -r requirements-ml.txt`，
# 使 `pip install .[ml]` 可独立启用 NLP/ML 能力而无需污染基础镜像。

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.43",
    "torch>=2.0",
    "transformers>=4.30",
]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | migrations
  | instance
  | migration_backups
  | backups
  | logs
  | node_modules
)/
'''
