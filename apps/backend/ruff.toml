# ruff 配置（D 线评估·阶段 0 安全子集）
# 说明：本仓库存在大量 __init__.py 再导出（蓝图注册用，被 app/__init__.py 外部 import），
# ruff 默认 F401 会把这些"本文件未直接使用"的再导出误判为未用并删除，导致路由注册 ImportError。
# 因此 F401 不纳入自动修复/门禁，改为阶段 1 人工逐站 review；本配置仅收口纯安全风格规则。
[lint]
select = [
    # 复杂度门禁（既有）
    "C901",
    # 纯安全风格规则（绝不删除 import / 不改运行时语义）
    "I001",    # import 排序
    "SIM117",  # 合并嵌套 with
    "UP009",   # asyncio 协程装饰器现代化
    "UP006",   # 类型注解用 PEP585 内置泛型
    "UP032",   # f-string 化 %/format
    "UP017",   # datetime.UTC 替代 datetime.timezone.utc
    "RUF010",  # 显式声明文件编码 UTF-8
    "RUF022",  # 排序 __all__
    "RUF100",  # 删除无用 noqa
    "RUF046",  # 整数除法用 // 语义纠正
    "PLR1711", # 无用 return None
    "PLR0402", # 用 dict/list/str 字面量替代 dict()/list()
    "PLR1730", # 用 []/{} 替代 list()/dict() 调用
    "PLR1733", # 用 {} 替代 dict()
    "RET501",  # 直接 return 表达式而非 return None
    "FURB105", # 用 min/max 替代 if 赋值
    "FURB167", # 用 int 替代 float 转整
    "FURB188", # 用 decimal 替代浮点货币运算
    "PERF101", # 循环内不必要推导
]
# 分规则处理（D 阶段 1 决策）：DTZ / BLE001 明确不纳入门禁。
# - DTZ（naive datetime，约 598 处）：本仓库时区为单一本地时区，SQLite 全程存储 naive datetime，
#   与 legacy 比较逻辑一致；改为 tz-aware 需同步迁移 DB 字段与大量比较点，属独立大工程，故不强制。
# - BLE001（裸 except Exception，约 406 处）：错误处理以 @safe_handle 集中兜底 + 路由层 broad except
#   为主，属刻意的 fail-closed 惯例；逐处收窄风险高、收益低，故不强制。
ignore = ["DTZ", "BLE001"]
# 动态作用域目录：migrations 用 exec()、api/algorithm 用 Namespace 拼装，ruff 误报率高，整体移出门禁
exclude = ["migrations", "api/algorithm", ".workbuddy"]
# 测试目录：可用性探测 import（importorskip 模式）误报 F401/SIM117，豁免
[lint.per-file-ignores]
"tests/**" = ["F401", "SIM117"]
