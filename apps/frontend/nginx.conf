# ============================================================================
# 生产就绪 nginx 配置（修复 P0-c：纯 HTTP + SECURE cookie 互斥导致登录失效）
#
# 关键变更：
#   1. HTTP(80) 不再直接服务应用 —— 仅保留 ACME 证书签发路径与 /health 探活，
#      其余请求 301 跳转 HTTPS，避免浏览器在明文下拒绝写入 Secure cookie。
#   2. HTTPS(443) 提供 TLS + HSTS，并固定 X-Forwarded-Proto=https，
#      使后端 SESSION_COOKIE_SECURE=True 在代理后正常工作。
#
# 部署前置（否则 443 server 块会因证书缺失启动失败）：
#   - 将真实证书挂载到容器 /etc/nginx/ssl/fullchain.pem 与 /etc/nginx/ssl/privkey.pem
#     （docker-compose 的 frontend 服务需新增 volume 映射，例如：
#        - ./ssl:/etc/nginx/ssl:ro
#     ）
#   - 或使用 certbot 自动签发：先以 80 端口完成 ACME 挑战，再启用 443 块。
# ============================================================================

# ---------------------------------------------------------------------------
# HTTP(80)：ACME 证书签发 + 健康检查，其余 301 → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # 允许 certbot / ACME 在 80 端口完成证书签发（勿跳转）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查保持明文，供容器 / 负载均衡探活（勿跳转）
    location /health {
        return 200 "OK\n";
    }

    # 其余全部 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS(443)：TLS + HSTS，承载全部应用流量
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    # 证书路径：部署时把真实证书挂到 /etc/nginx/ssl/（或用 certbot 生成）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # HSTS：强制浏览器仅通过 HTTPS 访问（含子域）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend（固定 X-Forwarded-Proto=https，使 SECURE cookie 正确下发）
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # WebSocket proxy（wss://）—— 升级头必须透传
    location /ws/ {
        proxy_pass http://backend:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA routing - redirect all non-static requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
