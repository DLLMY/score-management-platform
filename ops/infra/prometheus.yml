# Prometheus 抓取配置示例（P1-f 监控暴露收尾）
#
# 后端已在 APP_ENV != testing 时挂载免鉴权 /metrics 端点（app/metrics_exporter.py +
# app/__init__.py:96-99），且 docker-compose.yml 已把 backend 的 5000 端口映射到宿主机。
# 本文件供 Prometheus 抓取该端点，再接 Grafana 做面板与告警。
#
# 用法一（独立运行，不改 compose）：
#   docker run -p 9090:9090 \
#     -v "$(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml" \
#     prom/prometheus
#   浏览器打开 http://localhost:9090 → Status → Targets 应看到 score-backend UP。
#
# 用法二（并入一键监控栈，推荐）：
#   监控栈编排见同目录 docker-compose.monitoring.yml（Prometheus + Alertmanager + Grafana），
#   与主 docker-compose.yml 同目录运行即共享默认网络，可直接用服务名 backend:5000 抓取。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: score-management

# 告警规则（P1-f 监控/告警闭环收尾）：由 backend metrics_exporter 暴露的指标驱动
rule_files:
  - "alerting_rules.yml"

# 告警分发：Prometheus 评估命中后推送给 Alertmanager
# 注：需同时部署 Alertmanager，否则仅评估不分发；一键监控栈（含 Alertmanager）
#     见同目录 docker-compose.monitoring.yml。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "score-backend"
    metrics_path: /metrics
    scheme: http
    static_configs:
      # compose 内部用服务名；独立/外部部署改为 host:5000（如 127.0.0.1:5000）
      - targets: ["backend:5000"]
        labels:
          env: production

  # 可选：如需抓取 node 级指标，在目标机部署 node_exporter 后取消注释
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]

# ─────────────────────────────────────────────────────────────────────────────
# 告警闭环部署（P1-f 收尾）
#
# 一键监控栈（Prometheus + Alertmanager + Grafana）见同目录
# docker-compose.monitoring.yml；与主 docker-compose.yml 同目录运行即共享网络。
#
# 1) 校验规则语法：promtool check rules alerting_rules.yml
# 2) 通知渠道（Webhook/邮件/企业微信/钉钉）在 alertmanager.yml 中填充，凭据经 secret 注入。
# ─────────────────────────────────────────────────────────────────────────────
