# Grafana 看板 provisioning（P1-f 一键监控栈）
#
# 挂载到容器 /etc/grafana/provisioning/dashboards/（见 docker-compose.monitoring.yml）。
# Grafana 启动时扫描 options.path 目录下所有看板 JSON 并自动加载。
# 看板 JSON 由主仓 grafana/dashboard.json 单源提供，compose 将其挂载到
# /var/lib/grafana/dashboards/score-backend-monitor.json（勿复制成第二份）。

apiVersion: 1

providers:
  - name: score-backend
    orgId: 1
    folder: 积分管理平台监控
    folderUid: score-backend
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
