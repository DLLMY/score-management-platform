# 本地开发 / OTA e2e 验证用 mosquitto 配置
# 匿名开放，仅限本机/内网，勿暴露公网。

# 持久化（Broker 重启后保留订阅/保留消息/会话）
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# —— TCP 监听器（设备 / 后端 / 测试脚本对接）——
listener 1883
allow_anonymous true

# —— WebSocket 监听器（前端联调可选）——
listener 9001
protocol websockets
allow_anonymous true
