name: CI

# G5 CI 真实生效：push / PR 到 main 时自动跑零回归闸门
# - 后端：建 venv 装依赖，复用 .workbuddy/run_regr_full.py（12 批独立进程，规避 QueuePool 耗尽）
# - 前端：四闸门 tsc / eslint / prettier / vitest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create venv and install dependencies (pinned lock)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          # P1-d: 安装确定性锁文件（由 venv 的 pip freeze 生成，含 dev + ML 全量依赖，
          # 保证 CI 测试环境与本地/已测环境完全一致，消除 requirements.txt 中 >= 的非确定性）。
          pip install -r requirements.lock.txt
      - name: Run full regression (12 batches, isolated processes)
        run: |
          . .venv/bin/activate
          python ../../.workbuddy/run_regr_full.py
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: .workbuddy/regr_xml/*.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check (tsc)
        run: npx tsc --noEmit
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Unit tests (vitest)
        run: npm test
