name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gcc g++ make
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt --verbose
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        run: cd frontend && npm install --legacy-peer-deps --verbose
      
      - name: Build frontend
        run: cd frontend && npm run build
