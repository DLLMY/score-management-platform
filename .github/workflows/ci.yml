name: CI 回归基线

# 第九次评估建议落地：把 scripts/run_regression.sh 五步闸门固化进 CI。
# 设计要点：
#   - 后端不安装 torch（requirements 中 torch 为可选注释）；M10 懒加载后契约/路由测试无需 torch。
#   - 后端 job 不启动服务进程：G5 OpenAPI 走脚本"跳过不阻塞"分支，契约由 pytest test_api_envelope 兜底。
#   - 索引闸门前置：create_app 建表 + create_indexes --create（幂等）→ verify_indexes 全绿。
#   - PYTHON_BIN 环境变量让 run_regression.sh 在 CI（python）与本机（系统 3.11）通用。

on:
  push:
    branches: ['main', 'master', 'refactor/**']
  pull_request:

jobs:
  backend:
    name: 后端回归（RBAC/契约/关键路由/索引）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - name: 初始化数据库与索引（闸门前置）
        working-directory: backend
        run: |
          python -c "from app import app; print('[CI] DB init ok')"
          python scripts/create_indexes.py --create > /dev/null
          echo "[CI] 索引就绪"

      - name: 运行回归基线（G2 RBAC / G5 OpenAPI / 契约 / 关键路由 / 索引闸门）
        env:
          PYTHON_BIN: python
        run: bash scripts/run_regression.sh

  frontend-test:
    name: 前端单测（分片 ${{ matrix.shard }}/4）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # OOM 已根治于测试侧（2026-09-02 二分定位，前三次"并发/分片/堆大小"根因判断均被实测证伪）：
    # 真因是单个用例 PermissionGuard.test.tsx『empty permissions + not logged in redirects』——
    # 该用例只套 BrowserRouter 而无 <Routes>，PermissionGuard 返回的
    # <Navigate to='/login' state={{ from: location }} replace /> 跳转后 guard 不卸载 → 反复 Navigate
    # 形成无限跳转，且每轮 state.from 嵌套上一个 location，history 结构化克隆的对象链持续加深
    # → 堆内存级数增长直至 worker 崩溃（forks 表现为 OOM，threads 表现为 Worker exited unexpectedly）。
    # 实测：修复前单跑该文件限堆 640MB 即 66s OOM；修复后 10 passed / 129ms / 68MB。
    # 修复方式：该用例改用 MemoryRouter + <Routes>（含 /login 路由）使 guard 正常卸载，纯测试装配、不动产品代码。
    # 以下分片与堆设置保留为纵深防御（非根因修复）：① 分片 4 份跨 4 runner 并行，缩短墙钟；
    # ② VITEST_MAX_WORKERS=1 避免单 runner 内多 worker 重复加载 antd/recharts；
    # ③ heap 5120 留 GC 余量（< 7GB runner 上限，不触发机器级 OOM）。
    # 注：CI 必须用 forks（Linux 下 threads pool 报 webidl.markAsUncloneable）。
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      VITEST_MAX_WORKERS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest forks pool 在 Node 20 崩溃（webidl.markAsUncloneable），本地为 Node 22
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Vitest 分片 ${{ matrix.shard }}/4
        working-directory: frontend
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=dot

  frontend-build:
    name: 前端构建与 lint
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
