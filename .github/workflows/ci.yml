name: CI 回归基线

# 第九次评估建议落地：把 scripts/run_regression.sh 五步闸门固化进 CI。
# 设计要点：
#   - 后端不安装 torch（requirements 中 torch 为可选注释）；M10 懒加载后契约/路由测试无需 torch。
#   - 后端 job 不启动服务进程：G5 OpenAPI 走脚本"跳过不阻塞"分支，契约由 pytest test_api_envelope 兜底。
#   - 索引闸门前置：create_app 建表 + create_indexes --create（幂等）→ verify_indexes 全绿。
#   - PYTHON_BIN 环境变量让 run_regression.sh 在 CI（python）与本机（系统 3.11）通用。

on:
  push:
    branches: ['main', 'master', 'refactor/**']
  pull_request:

jobs:
  backend:
    name: 后端回归（RBAC/契约/关键路由/索引）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - name: 初始化数据库与索引（闸门前置）
        working-directory: backend
        run: |
          python -c "from app import app; print('[CI] DB init ok')"
          python scripts/create_indexes.py --create > /dev/null
          echo "[CI] 索引就绪"

      - name: 运行回归基线（G2 RBAC / G5 OpenAPI / 契约 / 关键路由 / 索引闸门）
        env:
          PYTHON_BIN: python
        run: bash scripts/run_regression.sh

  frontend-test:
    name: 前端单测（分片 ${{ matrix.shard }}/3）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 分片 + 单 worker 根治 OOM（保持 forks pool，CI 不可用 threads）：
    # 根因：CI 用 forks（Linux 下 threads pool 报 webidl.markAsUncloneable，不能切 threads）；
    # 每个 fork worker 是独立 Node 进程、各自独立加载 antd/recharts。VITEST_MAX_WORKERS=2 时
    # 单 runner 内 2 个 worker 各加载一份重依赖 → 单 worker 旧生代堆涨到 ~4GB 撞 V8 上限 OOM。
    # 修复：① 分片 3 份跨 3 个 runner 并行（墙钟不退化）；② 单 runner 内 VITEST_MAX_WORKERS=1，
    # 全量文件在同一 worker 顺序执行、antd/recharts 仅加载一次（~2GB），远低于 heap 4096 上限。
    # （曾试 heap 4096 + maxWorkers=2 仍 OOM；根因是 worker 数导致的重依赖重复加载，非堆不够。）
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest forks pool 在 Node 20 崩溃（webidl.markAsUncloneable），本地为 Node 22
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Vitest 分片 ${{ matrix.shard }}/3
        working-directory: frontend
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=dot

  frontend-build:
    name: 前端构建与 lint
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
