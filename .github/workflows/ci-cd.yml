name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # 后端测试
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r backend/requirements.txt
        working-directory: .

      - name: Lint with flake8
        run: |
          # 停止构建如果存在 Python 语法错误或未定义的名称
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # 退出零作为警告的折衷
          flake8 backend --count --exit-zero --max-line-length=120 --statistics
        working-directory: .

      - name: Run tests with pytest
        run: |
          pytest backend/tests/ -v --tb=short --cov=backend --cov-report=xml
        working-directory: .
        env:
          PYTHONPATH: ./backend
          FLASK_ENV: testing

  # 前端测试
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Lint code
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test -- --watchAll=false --coverage
        working-directory: frontend
        env:
          CI: true

      - name: Build project
        run: npm run build
        working-directory: frontend
        env:
          CI: false
