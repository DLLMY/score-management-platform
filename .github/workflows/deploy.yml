name: CD - Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      # P1-d：安装确定性依赖锁文件，消除 >= 非确定性（与生产镜像只装 requirements.txt 的轻量策略区分）
      - name: Install backend dependencies (deterministic lock)
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt --timeout=300

      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release Notes

            ### Changes in this Release
            - Auto-deployed by GitHub Actions
            - DB schema auto-reconciled on startup (P0-d: metadata-driven reconcile + idempotent seed)

            ### Full Changelog
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux 部署骨架（待真实服务器信息就绪后启用） ──
  # 启用条件：配置服务器 SSH 主机/用户/密钥（经 secrets 注入）后，将下方 if 改为 true。
  # 流程：拉取产物 → 安装锁文件依赖 → 运行 schema 对账迁移门控 → 重启服务。
  deploy-linux:
    name: Deploy to Linux Server
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }} # 待配置服务器 SSH 后启用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies (deterministic lock)
        working-directory: apps/backend
        run: pip install -r requirements.lock.txt --timeout=300

      # P0-d 迁移门控：复刻生产启动链路，发布前先幂等对账
      # （补全既有库缺失表/列/索引 + 补齐默认种子），失败即阻断发布。
      # 以下敏感变量由仓库 secrets 注入；未配置前本 job 不运行。
      - name: Run DB schema reconcile (P0-d migration gate)
        working-directory: apps/backend
        env:
          APP_ENV: production
          SQLALCHEMY_DATABASE_URI: ${{ secrets.SQLALCHEMY_DATABASE_URI }}
          ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          python -c "from app import create_app; from app.db_init import init_database; app = create_app(); init_database(app); print('[DEPLOY] schema reconcile done')"

      - name: Deploy to server (placeholder)
        run: echo "Add SSH/scp/restart steps here once server secrets are configured"

  deploy-windows:
    name: Deploy to Windows Server
    runs-on: windows-latest
    needs: build
    if: ${{ false }} # 暂时禁用，等配置服务器后启用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to server
        run: echo "Add your deployment steps here"
